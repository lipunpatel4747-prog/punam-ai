<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSA</title><link rel="manifest" href="manifest.json">
<style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
button{font-size:22px;padding:16px 32px;border:0;border-radius:40px;background:#6c5ce7;color:#fff;margin:10px}
input{width:90%;padding:10px;font-size:16px}
#log{text-align:left;margin-top:20px;font-size:17px;line-height:1.5}
</style></head><body>
<h1>Punam AI</h1>
<input id="key" type="password"  placeholder="Gemini API key yahan daalo">
<br><button id="btn">Start</button>
<div id="status">Band hai</div>
<div id="log"></div>
<script>
window.onerror=function(m,s,l){document.getElementById('log').innerHTML+='<p>JS Error: '+m+' (line '+l+')</p>';};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const key=document.getElementById('key'),btn=document.getElementById('btn'),
st=document.getElementById('status'),log=document.getElementById('log');
let on=false,busy=false,history=[],rec;try{key.value=localStorage.getItem('pkey')||key.value;i}catch(e){}

function add(w,t){log.innerHTML+='<p><b>'+w+':</b> '+t+'</p>';}

function speak(t){
  return new Promise(r=>{
    const u=new SpeechSynthesisUtterance(t);
    u.lang='hi-IN';u.onend=r;u.onerror=r;
    speechSynthesis.speak(u);
  });
}

async function ask(text){
  history.push({role:'user',parts:[{text:text}]});
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),60000);
  try{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent',{
      method:'POST',
      signal:ctrl.signal,
      headers:{
        'content-type':'application/json',
        'x-goog-api-key':key.value.trim()
      },
      body:JSON.stringify({
        systemInstruction:{parts:[{text:'Tumhara naam Punam hai. Tum ek dost ki tarah Hinglish mein chhote, natural jawab deti ho. Abhi ka samay aur tareekh: '+new Date().toLocaleString('en-IN',{dateStyle:'full',timeStyle:'short'})+'.'}]},
        contents:history
      })
    });
    const d=await res.json();
    if(!res.ok)throw new Error('HTTP '+res.status+': '+((d.error&&d.error.message)||''));
    const parts=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
    if(!parts)throw new Error('Khali jawab: '+JSON.stringify(d).slice(0,200));
    const a=parts.map(p=>p.text||'').join('');
    history.push({role:'model',parts:[{text:a}]});
    return a;
  }catch(e){
    history.pop();
    throw new Error(e.name==='AbortError'?'25 second mein jawab nahi aaya':e.message);
  }finally{
    clearTimeout(timer);
  }
}

function listen(){
  if(!on)return;
  rec=new SR();rec.lang='hi-IN';
  st.textContent='Sun rahi hoon...';
  rec.onresult=async e=>{
    const t=e.results[0][0].transcript;
    add('Aap',t);busy=true;st.textContent='Soch rahi hoon...';
    try{
      const a=await ask(t);add('Punam',a);
      st.textContent='Bol rahi hoon...';await speak(a);
    }catch(err){add('Error',err.message);}
    busy=false;
  };
  rec.onerror=e=>{add('Mic Error',e.error);};
  rec.onend=()=>{
    if(!on)return;
    const w=setInterval(()=>{if(!busy){clearInterval(w);listen();}},300);
  };
  try{rec.start();}catch(e){}
}

btn.onclick=()=>{
  if(!SR){alert('Chrome use karo');return;}
  on=!on;try{localStorage.setItem('pkey',key.value.trim());}catch(e){}
  btn.textContent=on?'Stop':'Start';
  if(on)listen();
  else{st.textContent='Band hai';speechSynthesis.cancel();rec&&rec.stop();}
};
</script></body></html>
